services:
  db:
    image: mysql:8
    environment:
      # Los secretos se inyectan desde el archivo .env externo, no se suben a Git
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: planes_db
    volumes:
      # Volumen nombrado gestionado por Docker para persistencia de datos
      - db_data:/var/lib/mysql
    healthcheck:
      # Chequeo para confirmar que MySQL está listo para aceptar conexiones
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    image: ghcr.io/frp274/backend:v1.0.0
    environment:
      # String de conexión apuntando al nombre del servicio "db"
      DB_DSN: "root:${DB_PASSWORD}@tcp(db:3306)/planes_db"
    ports:
      - "8080:8080"
    depends_on:
      db:
        # El backend espera a que MySQL pase el healthcheck antes de arrancar
        condition: service_healthy

  frontend:
    image: ghcr.io/frp274/frontend:v1.0.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  # Declaración del volumen nombrado
  db_data: