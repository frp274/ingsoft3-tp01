name: CI # El nombre del workflow que verás en la pestaña Actions de GitHub

on:
  pull_request:
    branches: [main] # Corre ANTES del merge. Es el disparador que alimenta al gate bloqueando PRs rotos
  push:
    branches: [main] # Corre DESPUÉS del merge a main. Actualiza el badge en el README y deja el caché base para futuros PRs

jobs:
  build-backend: # Este ID exacto es el que debes escribir al configurar el "Required status check" en GitHub
    runs-on: ubuntu-latest # Ejecuta en una máquina virtual Linux limpia y efímera prestada por GitHub
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          # Construye el nombre de la rama correctamente en el contexto de un PR (evita que diga "numero/merge")
          RAMA: ${{ github.head_ref || github.ref_name }} 
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6 # Clona tu repositorio en la máquina virtual

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4 # Cambia el constructor por defecto de Docker por uno que sabe enviar capas al almacén de GitHub

      - name: Construir imagen de test del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          tags: backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Ejecutar pruebas y verificar umbral de cobertura (80%)
        run: |
          mkdir -p backend-coverage
          docker run --rm -v ${{ github.workspace }}/backend-coverage:/out backend:test

      - name: Publicar resumen de cobertura del backend
        if: always()
        run: |
          if [ -f backend-coverage/coverage-summary.md ]; then
            cat backend-coverage/coverage-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Subir artefactos de cobertura del backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: backend-coverage/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen del backend para producción
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend: # Corre en paralelo para verificar el frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen de test del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          tags: frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Ejecutar pruebas unitarias y verificar umbral de cobertura (80%)
        run: |
          mkdir -p frontend-coverage
          docker run --rm -v ${{ github.workspace }}/frontend-coverage:/app/coverage frontend:test

      - name: Publicar resumen de cobertura del frontend
        if: always()
        run: |
          if [ -f frontend-coverage/coverage-summary.json ]; then
            LINES=$(node -e 'console.log(require("./frontend-coverage/coverage-summary.json").total.lines.pct)')
            BRANCHES=$(node -e 'console.log(require("./frontend-coverage/coverage-summary.json").total.branches.pct)')
            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🧪 Resumen de Cobertura de Tests - Frontend (Vitest)
          | Métrica | Cobertura Obtenida | Umbral Requerido | Estado |
          | :--- | :--- | :--- | :--- |
          | **Líneas** | \`${LINES}%\` | \`80.0%\` | $(node -e "console.log($LINES >= 80 ? '✅ Aprobado' : '❌ Reprobado')") |
          | **Ramas (Branches)** | \`${BRANCHES}%\` | \`80.0%\` | $(node -e "console.log($BRANCHES >= 80 ? '✅ Aprobado' : '❌ Reprobado')") |
          EOF
          fi

      - name: Subir artefactos de cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend-coverage/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen del frontend para producción
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    env:
      IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
      IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
    steps:
      - name: Disparar deploy en Render (QA)
        env:
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "Disparando deploy de API en QA con imagen: $IMG_API..."
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "${{ secrets.RENDER_HOOK_API_QA }}"
          echo "Disparando deploy de Frontend en QA con imagen: $IMG_FRONT..."
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "${{ secrets.RENDER_HOOK_FRONT_QA }}"

      - name: Smoke Test (QA)
        run: |
          echo "Iniciando Smoke Test para ambiente QA..."
          URLS=(
            "${{ vars.URL_FRONT_QA || vars.RENDER_URL_FRONT_QA || vars.PUBLIC_URL_FRONT_QA || vars.URL_FRONT || secrets.URL_FRONT_QA || secrets.RENDER_URL_FRONT_QA || secrets.PUBLIC_URL_FRONT_QA || secrets.URL_FRONT }}"
            "${{ vars.URL_API_QA || vars.RENDER_URL_API_QA || vars.PUBLIC_URL_API_QA || vars.URL_API || secrets.URL_API_QA || secrets.RENDER_URL_API_QA || secrets.PUBLIC_URL_API_QA || secrets.URL_API }}"
          )
          for url in "${URLS[@]}"; do
            if [ -z "$url" ]; then
              echo "⚠️ URL no configurada, omitiendo..."
              continue
            fi
            echo "Verificando servicio en: $url"
            SUCCESS=false
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              echo "Intento $i/30: HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
                echo "✅ Servicio respondiendo correctamente en $url (HTTP $HTTP_CODE)"
                SUCCESS=true
                break
              fi
              sleep 10
            done
            if [ "$SUCCESS" != "true" ]; then
              echo "❌ Error: El servicio en $url no respondió con HTTP 200 o 404 tras 30 intentos (último código: $HTTP_CODE)"
              exit 1
            fi
          done

  integracion:
    needs: deploy-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar pruebas de integración API con Playwright
        working-directory: ./frontend
        env:
          API_BASE_URL: https://api-qa-9v0x.onrender.com
        run: npx playwright test e2e/api.spec.js

      - name: Subir reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  e2e:
    needs: integracion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias y navegador Chromium
        working-directory: ./frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E de interfaz con Playwright
        working-directory: ./frontend
        env:
          E2E_BASE_URL: https://front-qa-3zl8.onrender.com
        run: npx playwright test e2e/planes.spec.js

      - name: Subir reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  deploy-prod:
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
      IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
    steps:
      - name: Disparar deploy en Render (PROD)
        env:
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          echo "Disparando deploy de API en PROD con imagen: $IMG_API..."
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "${{ secrets.RENDER_HOOK_API_PROD }}"
          echo "Disparando deploy de Frontend en PROD con imagen: $IMG_FRONT..."
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "${{ secrets.RENDER_HOOK_FRONT_PROD }}"

      - name: Smoke Test (PROD)
        run: |
          echo "Iniciando Smoke Test para ambiente PROD..."
          URLS=(
            "${{ vars.URL_FRONT_PROD || vars.RENDER_URL_FRONT_PROD || vars.PUBLIC_URL_FRONT_PROD || vars.URL_FRONT || secrets.URL_FRONT_PROD || secrets.RENDER_URL_FRONT_PROD || secrets.PUBLIC_URL_FRONT_PROD || secrets.URL_FRONT }}"
            "${{ vars.URL_API_PROD || vars.RENDER_URL_API_PROD || vars.PUBLIC_URL_API_PROD || vars.URL_API || secrets.URL_API_PROD || secrets.RENDER_URL_API_PROD || secrets.PUBLIC_URL_API_PROD || secrets.URL_API }}"
          )
          for url in "${URLS[@]}"; do
            if [ -z "$url" ]; then
              echo "⚠️ URL no configurada, omitiendo..."
              continue
            fi
            echo "Verificando servicio en: $url"
            SUCCESS=false
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              echo "Intento $i/30: HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
                echo "✅ Servicio respondiendo correctamente en $url (HTTP $HTTP_CODE)"
                SUCCESS=true
                break
              fi
              sleep 10
            done
            if [ "$SUCCESS" != "true" ]; then
              echo "❌ Error: El servicio en $url no respondió con HTTP 200 o 404 tras 30 intentos (último código: $HTTP_CODE)"
              exit 1
            fi
          done
